name: Auto Fix Bot

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  check-and-comment:
    name: PR Health Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check dependency conflicts
        id: dep-check
        run: |
          OUTPUT=$(npm ls --depth=0 2>&1 || true)
          if echo "$OUTPUT" | grep -qE "UNMET|INVALID"; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message=Dependency conflicts detected" >> $GITHUB_OUTPUT
          else
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "message=No dependency conflicts" >> $GITHUB_OUTPUT
          fi

      - name: Type-check server
        id: ts-server
        run: |
          npx tsc --project server/tsconfig.json --noEmit 2>&1 | tee /tmp/ts-server.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          NEON_DATABASE_URL: postgresql://ci:ci@localhost/ci
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          BETTER_AUTH_SECRET: ci-secret-for-type-check-only
        continue-on-error: true

      - name: Type-check client
        id: ts-client
        run: |
          npx tsc --project client/tsconfig.json --noEmit 2>&1 | tee /tmp/ts-client.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Build client
        id: build
        run: |
          npm run build:client 2>&1 | tee /tmp/build.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          NODE_ENV: production
        continue-on-error: true

      - name: Comment PR results
        uses: actions/github-script@v7
        with:
          script: |
            const depStatus = '${{ steps.dep-check.outputs.status }}';
            const tsServerExit = '${{ steps.ts-server.outputs.exit }}';
            const tsClientExit = '${{ steps.ts-client.outputs.exit }}';
            const buildExit = '${{ steps.build.outputs.exit }}';

            const icon = (ok) => ok ? '✅' : '❌';
            const body = [
              '## 🤖 Auto Fix Bot — PR Health Check',
              '',
              `| Check | Status |`,
              `|-------|--------|`,
              `| Dependencies | ${icon(depStatus === 'ok')} ${depStatus === 'ok' ? 'No conflicts' : 'Conflicts found'} |`,
              `| TypeScript (server) | ${icon(tsServerExit === '0')} ${tsServerExit === '0' ? 'Passed' : 'Errors found'} |`,
              `| TypeScript (client) | ${icon(tsClientExit === '0')} ${tsClientExit === '0' ? 'Passed' : 'Errors found'} |`,
              `| Client build | ${icon(buildExit === '0')} ${buildExit === '0' ? 'Passed' : 'Failed'} |`,
              '',
              depStatus !== 'ok' ? '> ⚠️ **Action needed:** Run `npm ci` and commit the updated `package-lock.json`.' : '',
              tsServerExit !== '0' ? '> ⚠️ **Action needed:** Fix server TypeScript errors. Run `npx tsc --project server/tsconfig.json --noEmit` locally.' : '',
              tsClientExit !== '0' ? '> ⚠️ **Action needed:** Fix client TypeScript errors. Run `npx tsc --project client/tsconfig.json --noEmit` locally.' : '',
              buildExit !== '0' ? '> ⚠️ **Action needed:** Client build failed. Run `npm run build:client` locally to reproduce.' : '',
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
