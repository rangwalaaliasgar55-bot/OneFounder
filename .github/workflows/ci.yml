name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  install-and-build:
    name: Install, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check server
        run: npx tsc --project server/tsconfig.json --noEmit
        env:
          NEON_DATABASE_URL: postgresql://ci:ci@localhost/ci
          DATABASE_URL: postgresql://ci:ci@localhost/ci
          BETTER_AUTH_SECRET: ci-secret-for-type-check-only

      - name: Type-check client
        run: npx tsc --project client/tsconfig.json --noEmit

      - name: Build client
        run: npm run build:client
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -f "dist/client/index.html" ]; then
            echo "Build failed: dist/client/index.html not found"
            exit 1
          fi
          echo "Build output verified:"
          ls -la dist/client/

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for dependency conflicts
        run: |
          OUTPUT=$(npm ls --depth=0 2>&1 || true)
          if echo "$OUTPUT" | grep -qE "UNMET|INVALID"; then
            echo "Dependency conflicts found:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "No dependency conflicts found"

      - name: Security audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
